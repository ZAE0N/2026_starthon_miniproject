<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학사일정 | 인하공업전문대학</title>
<!-- 웹폰트는 렌더를 막지 않게 불러옵니다.
     base.css 안에서 @import 로 부르면, base.css 를 다 받은 뒤에야
     CDN 주소를 발견해 DNS→TLS→CSS→폰트파일 순으로 줄줄이 기다립니다.
     여기서 preconnect 로 연결을 미리 열고, media 속임수로 화면을
     막지 않게 합니다. CDN 이 느리거나 죽어도 글자는 바로 나옵니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"></noscript>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/calendar.css">
</head>
<body>

<div class="page">
  <div class="page-banner">
    <div class="container">
      <div class="breadcrumb">홈 &rsaquo; 학사안내 &rsaquo; 학사일정</div>
      <h1>학사일정</h1>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <div id="calMount"></div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/calendar.js"></script>
<script src="js/chat-engine.js"></script>
<script>
onDataReady(function () {
  mountLayout("학사안내");
  mountCalendar(document.getElementById("calMount"));
});
</script>
</body>
</html>
