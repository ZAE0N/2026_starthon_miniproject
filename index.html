<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인하공업전문대학</title>
<!-- 웹폰트는 렌더를 막지 않게 불러옵니다.
     base.css 안에서 @import 로 부르면, base.css 를 다 받은 뒤에야
     CDN 주소를 발견해 DNS→TLS→CSS→폰트파일 순으로 줄줄이 기다립니다.
     여기서 preconnect 로 연결을 미리 열고, media 속임수로 화면을
     막지 않게 합니다. CDN 이 느리거나 죽어도 글자는 바로 나옵니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"></noscript>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/calendar.css">
</head>
<body>

<div class="page">
  <a class="hero" href="page.html?slug=greeting">
    <div class="container">
      <p class="eyebrow">INHATC</p>
      <h1>그 젊음의 앞이<br>늘 당당할 수 있도록</h1>
      <p class="sub">실무 중심 교육으로 함께 성장하는 인하공업전문대학</p>
      <span class="hero-more">대학 안내 보기 →</span>
    </div>
  </a>

  <section class="section">
    <div class="container">
        <div class="sec-head">
          <h2>공지사항</h2>
          <span class="sec-count" id="homeCount">0건</span>
          <div class="sec-actions" id="homeTabs"></div>
          <a class="pill on" id="moreBtn" href="notices.html">전체보기 →</a>
        </div>

        <div class="home-chip" id="homeChip">
          <span class="label">AI 도우미가 적용한 조건</span>
          <span class="tag" id="homeChipTags"></span>
          <button class="clear" onclick="homeClear()">해제 ✕</button>
        </div>

        <ul class="home-list" id="homeList"></ul>

      <div class="tiles">
        <a class="tile t-cyan" href="#" onclick="openCalendar();return false;">
          <span class="ico"></span><b>학사일정</b><span>이번 달 주요 일정</span></a>
        <a class="tile t-navy" href="page.html?slug=forms">
          <span class="ico"></span><b>증명 발급</b><span>재학 · 성적 증명서</span></a>
        <a class="tile t-navy" href="page.html?slug=campus">
          <span class="ico"></span><b>도서관</b><span>자료 검색과 열람실</span></a>
        <a class="tile t-amber" href="notices.html?category=채용">
          <span class="ico"></span><b>취업지원</b><span>채용 정보와 상담</span></a>
        <a class="tile t-navy ext" id="dormTile" href="#" target="_blank" rel="noopener noreferrer">
          <span class="ico"></span><b>생활관</b><span>기숙사 신청과 안내</span></a>
      </div>

    </div>
  </section>
</div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/calendar.js"></script>
<script src="js/chat-engine.js"></script>
<script src="js/home.js"></script>
<script>
onDataReady(function () {
  initHome();
  document.getElementById("dormTile").href = window.EXTERNAL.dorm;

});
</script>
</body>
</html>
